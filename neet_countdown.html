<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pradeep's Academy — NEET 2027 Countdown</title>
<style>
  :root{
    --bg-a:#FDEDE1; --bg-b:#FBE3ED; --bg-c:#ECE3F7; --bg-d:#E1EEF4;
    --ink:#4A3B6B;
    --ink-dim:#7C6D99;
    --ink-faint: rgba(74,59,107,0.42);
    --line: rgba(124,109,153,0.10);
    --bubble-border: rgba(124,109,153,0.38);
    --bubble-empty-bg: rgba(255,255,255,0.65);
    --accent:#8B6FD9;
    --accent-glow: rgba(139,111,217,0.30);
    --coral:#FF9B7A;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%; height:100%;
    overflow:hidden;
    font-family: ui-sans-serif, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 35%, var(--bg-c) 68%, var(--bg-d) 100%);
    color: var(--ink);
  }

  .sheet-bg{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 3.2vmin 3.2vmin;
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding: 5vmin 7vmin;
    text-align:center;
  }

  .logo{
    position:absolute; top:3.5vmin; left:50%; transform:translateX(-50%);
    height: 15vmin;
    filter: drop-shadow(0 0.5vmin 0.8vmin rgba(74,59,107,0.18));
  }

  .headline{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing:0.5em;
    font-weight:400;
    font-size:3.6vmin;
    color: var(--ink);
    text-transform:uppercase;
    padding-left:0.5em;
    margin-top: 12vmin;
    margin-bottom: 0.8vmin;
  }
  .headline b{
    font-weight:700;
    background: linear-gradient(90deg, var(--coral), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subline{
    font-size:1.6vmin;
    color: var(--ink-dim);
    letter-spacing:0.18em;
    text-transform:uppercase;
    margin-bottom: 5.5vmin;
  }

  .countdown{
    display:flex; align-items:flex-end; justify-content:center;
    gap: 4.5vmin;
  }
  .unit{ display:flex; flex-direction:column; align-items:center; }
  .digits{ display:flex; gap:0.8vmin; }

  .digit{
    display:flex; align-items:center; justify-content:center;
    min-width: 9vmin;
    height: 15vmin;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:12vmin;
    line-height:1;
    color: var(--ink);
    background: var(--bubble-empty-bg);
    border: 2px solid var(--bubble-border);
    border-radius: 1.6vmin;
    box-shadow: 0 0.6vmin 1.2vmin rgba(74,59,107,0.12);
  }

  .unit-label{
    margin-top:2.4vmin;
    font-size:2vmin;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color: var(--ink-dim);
  }

  .sep{
    align-self:center;
    display:flex; flex-direction:column; gap:1.6vmin;
    margin-bottom: 6vmin;
    opacity:0.55;
  }
  .sep span{
    width:1.3vmin; height:1.3vmin; border-radius:50%;
    background: var(--ink-faint);
  }

  .target{
    margin-top:5vmin;
    font-size:1.6vmin;
    letter-spacing:0.1em;
    color: var(--ink-dim);
  }
  .target b{ color: var(--ink); font-weight:600; }

  .progress-wrap{
    margin-top:3.2vmin;
    width: 48vmin;
    display:flex; flex-direction:column; gap:1.1vmin;
  }
  .progress-label{
    display:flex; justify-content:space-between;
    font-size:1.3vmin; letter-spacing:0.2em; text-transform:uppercase;
    color: var(--ink-dim);
  }
  .progress-track{
    width:100%; height:1.1vmin;
    border:1.6px solid var(--bubble-border);
    border-radius: 999px;
    overflow:hidden;
    background: rgba(255,255,255,0.55);
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--coral), var(--accent));
    border-radius:999px;
    transition: width 1s ease;
  }

  .quote{
    position:absolute; bottom:8.5vmin; left:50%; transform:translateX(-50%);
    font-size:2.6vmin; letter-spacing:0.03em; line-height:1.4;
    color: var(--ink-dim);
    max-width:76vw;
    opacity:0;
    transition: opacity 1.2s ease;
    font-style: italic;
    text-align:center;
  }
  .quote.show{ opacity:1; }

  .secondary{
    margin-top:3.2vmin;
    display:flex; flex-direction:column; align-items:center;
  }
  .secondary-title{
    font-size:1.5vmin; letter-spacing:0.28em; text-transform:uppercase;
    color: var(--ink-dim); margin-bottom:1.4vmin;
  }
  .secondary-title .tentative{
    font-style:italic; opacity:0.75; letter-spacing:0.05em; text-transform:none;
  }
  .countdown.small{ gap:2.2vmin; }
  .countdown.small .digit{
    min-width:4.6vmin; height:6.6vmin; font-size:5vmin; border-radius:0.9vmin;
  }
  .countdown.small .unit-label{
    margin-top:1.2vmin; font-size:1.15vmin; letter-spacing:0.28em;
  }
  .countdown.small .sep{ gap:0.8vmin; margin-bottom:2.6vmin; }
  .countdown.small .sep span{ width:0.7vmin; height:0.7vmin; }

  .footer{
    position:absolute; bottom:2.8vmin; left:50%; transform:translateX(-50%);
    font-size:1.2vmin; letter-spacing:0.04em;
    color: var(--ink-faint);
    text-align:center;
    white-space:nowrap;
  }

  .fs-hint{
    position:absolute; top:3vmin; right:3vmin;
    font-size:1.2vmin; color: var(--ink-dim);
    border:1px solid var(--bubble-border);
    padding: 0.9vmin 1.6vmin; border-radius: 999px;
    cursor:pointer; letter-spacing:0.1em; text-transform:uppercase;
    background: rgba(255,255,255,0.55);
  }
  .fs-hint.hidden{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .progress-fill, .quote{ transition:none; }
  }
</style>
</head>

    <div class="headline">NEET <b>2027</b></div>

    <div class="countdown" id="countdown"></div>

    <div class="target">Tentative date <b>02 May 2027</b> · official date awaited from NTA</div>

    <div class="secondary">
      <div class="secondary-title">JEE Main 2027 · Session 1 <span class="tentative">(tentative — Jan 2027, official date awaited)</span></div>

<script>
  // ---- configuration ----
  // Update TARGET_DATE once NTA announces the official NEET 2027 date.
  const TARGET_DATE = new Date("2027-05-02T09:00:00+05:30");
  // Tentative — JEE Main 2027 Session 1 usually falls in the last week of January.
  // Update once NTA releases the official information bulletin.
  const TARGET_DATE_2 = new Date("2027-01-24T09:00:00+05:30");

  const QUOTES = [
    "Every solved numerical is one less surprise on exam day.",
    "Biology rewards repetition. Physics rewards patience. Both reward you.",
    "Aaj ka ek revision, exam din ka ek confident answer.",
    "The syllabus doesn't get shorter — your grip on it gets stronger.",
    "Mistakes in a mock test are cheaper than mistakes on 2 May.",
    "Consistency beats intensity. Show up for today's chapter.",
    "You don't need a perfect day. You need one more focused hour.",
    "NCERT lines aaj padho, exam mein wahi lines marks banayengi.",
    "The topper isn't smarter — they just didn't skip the boring chapters.",
    "Doubt today, clarity tomorrow. Never carry a doubt past sunset.",
    "Revision is not going back — it's locking in what you already earned.",
    "Har mock test ek free lesson hai — usse seekho, usse dro mat.",
    "Small steady effort beats one heroic night before the exam.",
    "Your competition is not the topper — it's yesterday's version of you.",
    "Formulae fade with sleep loss. Rest is part of the syllabus too.",
    "One difficult chapter mastered is worth ten easy ones skimmed.",
    "Galtiyan chhupao mat, unhi mein agla sawal chhupa hota hai.",
    "The NEET syllabus rewards depth, not speed alone — go slow to go fast.",
    "You are not behind. You are exactly where consistent effort has placed you.",
    "Physics numericals reward calm hands more than clever shortcuts.",
    "Har din ek chhota target — bade sapne yun hi poore hote hain.",
    "Confidence on exam day is built quietly, months before it.",
    "A revised weak topic is more valuable than a re-revised strong one.",
    "Don't fear the syllabus. Break it into pieces small enough to finish today.",
    "Practice questions you get wrong are the real syllabus for tomorrow.",
    "Aaram zaroori hai, lekin discipline usse bhi zaroori hai.",
    "The exam only tests what you practiced — so practice like it's exam day.",
    "Every diagram you draw by hand sticks longer than one you only read.",
    "Focus beats duration. Two focused hours beat five distracted ones.",
    "Mistakes on a mock test today save marks on 2 May.",
    "Jo aaj mushkil lagta hai, wahi kal ka sabse aasan chapter banega.",
    "Success in NEET is a thousand small disciplined choices, not one big one.",
    "Don't compare chapters completed — compare concepts truly understood.",
    "The best revision is teaching the concept to yourself out loud.",
    "Speed comes after accuracy — never the other way around.",
    "Ek acha mock test result nahi, ek acha analysis matter karta hai.",
    "You built this far with discipline. Trust it on exam day too.",
    "Chemistry rewards memory with logic — build the logic first.",
    "Every early morning study hour compounds more than a late night cram.",
    "Botany aur Zoology mein diagrams hi asli marks dilate hain.",
    "The goal isn't perfection today — it's progress you can measure.",
    "Read the question twice. Most silly mistakes hide in the first reading.",
    "Rest days aren't lost days — they're what make the next week possible.",
    "Aapka target sirf ek number nahi, ek habit hai jo roz banti hai.",
    "The syllabus is long, but your daily effort only needs to be honest.",
    "Every formula you derive yourself, you'll never truly forget.",
    "Don't wait to feel ready — start, and readiness follows the work.",
    "Jo topic dar lagta hai, usi topic ko sabse pehle padho.",
    "Your notes today are your fastest revision six months from now.",
    "Discipline is choosing between what you want now and what you want most.",
    "Exam hall mein sirf wahi kaam aayega jo aapne khud practice kiya.",
    "Stay consistent even on the days motivation doesn't show up.",
    "The last hour of study matters as much as the first — don't rush it.",
    "Progress hides in the boring, repetitive days — trust the process.",
    "Jitna clear concept hoga, utna hi confident aap paper mein honge."
  ];

  function buildCountdown(rootId, targetDate, opts){
    opts = opts || {};
    const root = document.getElementById(rootId);
    const prefix = rootId + "-";

    function makeDigit(d){
      const box = document.createElement("div");
      box.className = "digit";
      box.textContent = d;
      return box;
    }
    function buildUnit(id, label, digitCount){
      const unit = document.createElement("div");
      unit.className = "unit";
      const digitsWrap = document.createElement("div");
      digitsWrap.className = "digits";
      digitsWrap.id = "digits-" + prefix + id;
      for(let i=0;i<digitCount;i++){
        digitsWrap.appendChild(makeDigit("0"));
      }
      const lbl = document.createElement("div");
      lbl.className = "unit-label";
      lbl.textContent = label;
      unit.appendChild(digitsWrap);
      unit.appendChild(lbl);
      return unit;
    }
    function buildSep(){
      const s = document.createElement("div");
      s.className = "sep";
      s.innerHTML = "<span></span><span></span>";
      return s;
    }

    const lastValues = {};
    function renderUnit(id, valueStr){
      const key = prefix + id;
      if(lastValues[key] === valueStr) return;
      lastValues[key] = valueStr;
      const wrap = document.getElementById("digits-" + key);
      const needed = valueStr.length;
      while(wrap.children.length < needed) wrap.insertBefore(makeDigit("0"), wrap.firstChild);
      while(wrap.children.length > needed) wrap.removeChild(wrap.firstChild);
      [...valueStr].forEach((ch, i)=>{ wrap.children[i].textContent = ch; });
    }

    root.appendChild(buildUnit("days","days",3));
    root.appendChild(buildSep());
    root.appendChild(buildUnit("hours","hours",2));
    root.appendChild(buildSep());
    root.appendChild(buildUnit("mins","minutes",2));
    root.appendChild(buildSep());
    root.appendChild(buildUnit("secs","seconds",2));

    function tick(){
      const now = new Date();
      let diff = targetDate - now;
      if(diff <= 0){
        if(opts.onComplete) opts.onComplete();
        root.style.display = "none";
        return;
      }
      const totalSeconds = Math.floor(diff/1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      renderUnit("days", String(days).padStart(3,"0"));
      renderUnit("hours", String(hours).padStart(2,"0"));
      renderUnit("mins", String(mins).padStart(2,"0"));
      renderUnit("secs", String(secs).padStart(2,"0"));
    }
    tick();
    setInterval(tick, 1000);
  }

  buildCountdown("countdown", TARGET_DATE, {
    onComplete: function(){
      document.querySelector(".headline").innerHTML = 'NEET <b>2027</b> — All the best!';
      document.querySelector(".subline").textContent = "go show them what the last few months built";
    }
  });
  buildCountdown("countdown2", TARGET_DATE_2);

  const quoteEl = document.getElementById("quote");
  let qIndex = 0;
  function showQuote(){
    quoteEl.classList.remove("show");
    setTimeout(()=>{
      quoteEl.textContent = "\u201C" + QUOTES[qIndex % QUOTES.length] + "\u201D";
      quoteEl.classList.add("show");
      qIndex++;
    }, 400);
  }
  showQuote();
  setInterval(showQuote, 11000);

  const fsHint = document.getElementById("fsHint");
  function goFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if(req){ req.call(el).catch(()=>{}); }
    fsHint.classList.add("hidden");
  }
  fsHint.addEventListener("click", goFullscreen);
  document.addEventListener("keydown", goFullscreen, { once:true });
  setTimeout(()=>{ fsHint.classList.add("hidden"); }, 8000);
</script>
